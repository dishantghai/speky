# SPEKY Testing Configuration
# Generated by speky test init

enabled: True
version: 0.1.0
coverage_threshold: 80

# frameworks

# flutter
frameworks.flutter.unit: flutter_test
frameworks.flutter.widget: flutter_test
frameworks.flutter.integration: patrol
frameworks.flutter.coverage_tool: lcov

# python
frameworks.python.unit: pytest
frameworks.python.integration: pytest
frameworks.python.coverage_tool: pytest-cov

# web
frameworks.web.unit: vitest
frameworks.web.e2e: playwright
frameworks.web.coverage_tool: c8

# e2e

# web
e2e.web.framework: playwright
e2e.web.mcp_enabled: True
e2e.web.headless: True

# mobile
e2e.mobile.framework: patrol
e2e.mobile.enabled: False
data_strategy: hybrid

# detected_tech_stack
detected_tech_stack.python: True
